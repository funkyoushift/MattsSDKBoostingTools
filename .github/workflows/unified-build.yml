name: Unified desktop verification
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Stable source version
        required: true
        default: '2.41.2'
      linux_runner:
        description: Linux test environment (22.04 is a compatibility diagnostic, not a waiver of newer-host failures)
        type: choice
        options: [ubuntu-latest, ubuntu-22.04]
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron_poc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm --prefix electron_poc ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          python -m pip install pytest==9.2.0 PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
      - name: Python syntax and startup before SDK packaging
        shell: pwsh
        run: |
          python -m compileall -q mod_extracted/MattsSDKBoostingTools external_app/v22_parts_codes_fixed
          if ($LASTEXITCODE -ne 0) { throw 'Syntax check failed' }
          $env:PYTHONPATH = Join-Path $PWD 'tools'
          python -m pytest tools/tests/test_quick_menu_no_blimgui.py tools/tests/test_release_sdk_imports.py tools/tests/test_pack_sdkmod_zip.py tools/tests/test_shift_background.py tools/tests/test_shift_background_http.py tools/tests/test_shift_overlay.py tools/tests/test_shift_storage_http.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Offline startup and SHiFT background checks failed' }
      - name: Verify SHiFT desktop guidance and controller lifecycle
        shell: pwsh
        run: |
          node tools/afk_lobby/test_shift_background.js
          if ($LASTEXITCODE -ne 0) { throw 'SHiFT background lifecycle checks failed' }
          node tools/afk_lobby/test_shift_link.js
          if ($LASTEXITCODE -ne 0) { throw 'SHiFT link checks failed' }
          Push-Location electron_poc
          try { npx electron test_afk_lobby.js; if ($LASTEXITCODE -ne 0) { throw 'SHiFT desktop guidance check failed' } }
          finally { Pop-Location }
      - name: Verify Windows update handoff
        shell: pwsh
        run: |
          node electron_poc/test_windows_update_handoff.js
          if ($LASTEXITCODE -ne 0) { throw 'Windows update handoff failed' }
          node electron_poc/test_platform_updater_electron_asar.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron ASAR updater regression failed' }
      - name: Build and audit Windows packages
        shell: pwsh
        run: |
          $version = (Get-Content -Raw electron_poc/package.json | ConvertFrom-Json).version
          if ($version -cne $env:EXPECTED_VERSION -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Unexpected source version' }
          ./tools/build_electron_beta.ps1 -Installer
      - name: Test actual installed payload
        shell: pwsh
        run: ./tools/verify_windows_release.ps1 -Version $env:EXPECTED_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: msbt-windows-${{ inputs.expected_version }}
          path: |
            dist_electron/MSBT-Installer-v${{ inputs.expected_version }}.exe
            dist_electron/MSBT-Portable-v${{ inputs.expected_version }}-win-x64.zip
            dist_electron/windows-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  linux:
    runs-on: ${{ inputs.linux_runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron_poc/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install locked dependencies and headless desktop prerequisites
        run: |
          npm --prefix electron_poc ci
          sudo apt-get update
          if apt-cache show libgtk-3-0t64 >/dev/null 2>&1; then
            sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
          else
            sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          fi
      - name: Record Linux sandbox environment without modifying policy
        run: |
          mkdir -p dist_linux
          { cat /etc/os-release; uname -a; id; sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces || true; } > dist_linux/linux-host.txt
      - name: Release gate and verifier regression checks
        run: |
          python -m unittest discover -s tools/tests -p test_release_gate.py
          python -m unittest discover -s tools/tests -p test_publish_verified_release.py
          python -m unittest discover -s tools/tests -p test_verify_linux_release.py
          python -m unittest tools.tests.test_linux_bootstrap
      - name: Build Linux installer and portable archive
        run: python tools/build_linux.py
      - name: Verify native Linux packages, install, updater and Proton fixtures
        run: python tools/verify_linux_release.py --version '${{ inputs.expected_version }}' --output dist_linux/linux-platform-verification.json
      - name: Preserve Linux verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verification-evidence
          path: |
            dist_linux/linux-platform-verification.json
            dist_linux/linux-host.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: msbt-linux-${{ inputs.expected_version }}
          path: |
            dist_linux/MSBT-Installer-v${{ inputs.expected_version }}-linux-x64.AppImage
            dist_linux/MSBT-Portable-v${{ inputs.expected_version }}-linux-x64.tar.gz
            dist_linux/linux-platform-verification.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release_gate:
    name: Required Windows and Linux release gate
    needs: [windows, linux]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Require successful verification on both operating systems
        env:
          WINDOWS_RESULT: ${{ needs.windows.result }}
          LINUX_RESULT: ${{ needs.linux.result }}
        run: |
          test "$WINDOWS_RESULT" = success
          test "$LINUX_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: msbt-*-${{ inputs.expected_version }}
          path: release-artifacts
          merge-multiple: true
      - name: Validate exact four artifacts and platform receipts
        run: >-
          python tools/release_gate.py
          --version '${{ inputs.expected_version }}'
          --source-commit '${{ github.sha }}'
          --artifacts-dir release-artifacts
          --windows-receipt release-artifacts/windows-verification.json
          --linux-receipt release-artifacts/linux-platform-verification.json
          --output release-artifacts/release-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ inputs.expected_version }}
          path: release-artifacts/release-verification.json
          if-no-files-found: error
