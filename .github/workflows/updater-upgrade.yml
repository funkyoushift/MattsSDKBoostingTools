name: Real published updater upgrade
on:
  workflow_dispatch:
    inputs:
      install_volume:
        description: Disposable Windows install location (runner or system temp volume)
        type: choice
        required: true
        default: runner
        options: [runner, system]
      candidate_handoff:
        description: Test candidate updater module inside old Windows baseline (modified diagnostic client)
        type: boolean
        required: false
        default: false
      mode:
        description: Upgrade qualification or benign process lifetime experiment
        type: choice
        required: true
        default: upgrade
        options: [upgrade, lifetime]
      platform:
        description: Native platform to verify
        type: choice
        required: true
        default: all
        options: [windows, linux, all]
permissions:
  contents: read
jobs:
  windows:
    if: inputs.platform == 'windows' || inputs.platform == 'all'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Benign Windows helper lifetime experiment
        if: inputs.mode == 'lifetime'
        timeout-minutes: 3
        shell: pwsh
        run: node tools/tests/updater_windows_lifetime.js "$env:RUNNER_TEMP/msbt-updater-lifetime"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode == 'lifetime'
        with:
          name: windows-updater-lifetime-evidence
          path: ${{ runner.temp }}/msbt-updater-lifetime
          if-no-files-found: error
      - name: Actual released Windows updater 2.41.1 to 2.41.2
        if: inputs.mode != 'lifetime'
        timeout-minutes: 18
        shell: pwsh
        env:
          CANDIDATE_HANDOFF: ${{ inputs.candidate_handoff }}
          INSTALL_VOLUME: ${{ inputs.install_volume }}
        run: ./tools/tests/updater_real_windows.ps1 -CandidateHandoff:($env:CANDIDATE_HANDOFF -eq 'true') -SystemTemp:($env:INSTALL_VOLUME -eq 'system')
      - uses: actions/upload-artifact@v4
        if: always() && inputs.mode != 'lifetime'
        with:
          name: windows-real-updater-evidence
          path: ${{ runner.temp }}/msbt real upgrade receipts
          if-no-files-found: warn
  linux:
    if: inputs.mode != 'lifetime' && (inputs.platform == 'linux' || inputs.platform == 'all')
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Disposable native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool libgtk-3-0 libnss3 libasound2 libx11-6
      - name: Actual released Linux updater 2.41.1 to 2.41.2
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ github.token }}
        run: xvfb-run -a node tools/tests/updater_real_linux.js "$RUNNER_TEMP/linux-updater-receipt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-real-updater-evidence
          path: ${{ runner.temp }}/linux-updater-receipt
          if-no-files-found: warn
