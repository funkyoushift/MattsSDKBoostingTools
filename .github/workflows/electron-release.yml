name: Release tag verification
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate coordinated release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          package=json.loads(Path('electron_poc/package.json').read_text())
          manifest=json.loads(Path('docs/releases/latest.json').read_text())
          assert os.environ['RELEASE_TAG']=='v'+package['version']
          assert manifest['package_version']==package['version']
          assert set(manifest['platforms'])=={'win32','linux'}
          print('Tag verified. Artifact builds use unified-build.yml and tools/build_linux.py.')
          print('Publish only the four application files; GitHub adds two source archives.')
          PYCODE
