name: MSBT Mobile Beta Build

on:
  push:
    branches:
      - mobile-controller-prototype
      - release/mobile-beta
    paths:
      - 'mobile_controller/**'
      - 'external_app/v22_parts_codes_fixed/resources/MattsSDKBoostingTools_gzo_codes.json'
      - 'external_app/v22_parts_codes_fixed/resources/MattsSDKBoostingTools_lootlemon_codes.json'
      - 'external_app/v22_parts_codes_fixed/resources/custom_bl4_codes.json'
      - 'external_app/v22_parts_codes_fixed/resources/item_pools.json'
      - 'external_app/v22_parts_codes_fixed/resources/travelmaps_flat.json'
      - 'external_app/v22_parts_codes_fixed/resources/travelstations.json'
      - 'electron_poc/dev_spawner_catalog.json'
      - '.github/workflows/mobile-beta-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode and verify stable beta signing key
        shell: bash
        run: |
          base64 -d mobile_controller/debug-signing/msbt-mobile-debug.keystore.b64 > mobile_controller/debug-signing/msbt-mobile-debug.keystore
          keytool -list -keystore mobile_controller/debug-signing/msbt-mobile-debug.keystore -storepass android -alias androiddebugkey

      - name: Build Android debug APK
        shell: bash
        run: gradle -p mobile_controller :app:assembleDebug --stacktrace

      - name: Prepare beta files
        shell: bash
        run: |
          VERSION_NAME=$(grep -oP "versionName '\\K[^']+" mobile_controller/app/build.gradle | head -1)
          VERSION_CODE=$(grep -oP "versionCode \\K[0-9]+" mobile_controller/app/build.gradle | head -1)
          mkdir -p mobile_beta_out/test-kit
          cp mobile_controller/app/build/outputs/apk/debug/app-debug.apk mobile_beta_out/MSBT-Mobile-Controller.apk
          cp mobile_controller/app/build/outputs/apk/debug/app-debug.apk "mobile_beta_out/MSBT-Mobile-Controller-${VERSION_NAME}.apk"
          cp -r mobile_controller/test_kit/. mobile_beta_out/test-kit/
          printf '%s\n' "MSBT Mobile Controller open beta ${VERSION_NAME}" > mobile_beta_out/test-kit/VERSION.txt
          printf '%s\n' 'Install page: https://www.funkyoushift.com/MattsSDKBoostingTools/mobile-install.html' > mobile_beta_out/test-kit/DOWNLOAD.txt
          printf '%s\n' 'Direct APK: https://github.com/funkyoushift/MattsSDKBoostingTools/releases/download/mobile-beta/MSBT-Mobile-Controller.apk' >> mobile_beta_out/test-kit/DOWNLOAD.txt
          cat > mobile_beta_out/mobile-beta-version.json <<EOF
          {
            "versionName": "${VERSION_NAME}",
            "versionCode": ${VERSION_CODE},
            "installUrl": "https://www.funkyoushift.com/MattsSDKBoostingTools/mobile-install.html",
            "apkUrl": "https://github.com/funkyoushift/MattsSDKBoostingTools/releases/download/mobile-beta/MSBT-Mobile-Controller.apk",
            "apkVersionedUrl": "https://github.com/funkyoushift/MattsSDKBoostingTools/releases/download/mobile-beta/MSBT-Mobile-Controller-${VERSION_NAME}.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          # Trim leading spaces from heredoc indentation for valid JSON consumers.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('mobile_beta_out/mobile-beta-version.json')
          text = '\n'.join(line.lstrip() for line in p.read_text(encoding='utf-8').splitlines())
          p.write_text(text + '\n', encoding='utf-8')
          PY
          (cd mobile_beta_out/test-kit && zip -r "../MSBT-Mobile-Beta-Test-Kit-${VERSION_NAME}.zip" .)
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Upload APK only
        uses: actions/upload-artifact@v4
        with:
          name: MSBT-Mobile-Controller-${{ env.VERSION_NAME }}-APK
          path: mobile_beta_out/MSBT-Mobile-Controller-${{ env.VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload beta test kit separately
        uses: actions/upload-artifact@v4
        with:
          name: MSBT-Mobile-Beta-Test-Kit-${{ env.VERSION_NAME }}
          path: mobile_beta_out/MSBT-Mobile-Beta-Test-Kit-${{ env.VERSION_NAME }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable phone download (mobile-beta tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-beta
          name: MSBT Mobile Controller (open beta)
          prerelease: true
          make_latest: false
          body: |
            Open Android beta for MSBT Mobile Controller.

            **Recommended build: `${{ env.VERSION_NAME }}`** (current open beta).

            **Mobile Hoard + update UX:**
            - Full on-phone multi-wave Hoard editor with enemy-only search, multi-select, paging, and per-type counts
            - Per-wave spawn distance, points, burst, stagger, spacing, scale, vertical offset, aggro, and opt-in cleanup
            - Phone-local plan/wave favorites plus Send, Start, Stop, live status, and explicit Emergency Clear
            - Automatic update-available banner and manual check that opens the browser install page

            **Phone install page (recommended):**
            https://www.funkyoushift.com/MattsSDKBoostingTools/mobile-install.html

            **Always-current APK (direct):**
            https://github.com/funkyoushift/MattsSDKBoostingTools/releases/download/mobile-beta/MSBT-Mobile-Controller.apk

            Confirm **More → About** shows `${{ env.VERSION_NAME }}` (or newer).

            The app can check for updates in-app (launch / Connect / About → Check for updates).

            **Desktop Latest (Mobile Gateway + install QR):** https://github.com/funkyoushift/MattsSDKBoostingTools/releases/latest

            **Test kit:** download `MSBT-Mobile-Beta-Test-Kit-*.zip` from this release.

            Install over previous betas to keep local data.

            This is an **open beta** prerelease on `mobile-controller-prototype` / `release/mobile-beta`. It is not the public Windows MSBT Latest.

            This prerelease is updated by CI on `mobile-controller-prototype` and `release/mobile-beta`.
          files: |
            mobile_beta_out/MSBT-Mobile-Controller.apk
            mobile_beta_out/MSBT-Mobile-Controller-${{ env.VERSION_NAME }}.apk
            mobile_beta_out/mobile-beta-version.json
            mobile_beta_out/MSBT-Mobile-Beta-Test-Kit-${{ env.VERSION_NAME }}.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
