plugins {
    id 'com.android.application'
}

def msbtDebugKeystore = System.getenv('MSBT_MOBILE_DEBUG_KEYSTORE')

android {
    namespace 'com.funkyoushift.msbt.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.funkyoushift.msbt.mobile'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    signingConfigs {
        msbtDebug {
            if (msbtDebugKeystore) {
                storeFile file(msbtDebugKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            if (msbtDebugKeystore) {
                signingConfig signingConfigs.msbtDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
