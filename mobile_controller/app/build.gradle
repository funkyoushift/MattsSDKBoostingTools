plugins {
    id 'com.android.application'
}

android {
    namespace 'com.funkyoushift.msbt.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.funkyoushift.msbt.mobile'
        minSdk 28
        targetSdk 35
        versionCode 12
        versionName '0.1.0-beta.10'
    }

    def betaKeystore = file('../debug-signing/msbt-mobile-debug.keystore')
    signingConfigs {
        beta {
            if (betaKeystore.exists()) {
                storeFile betaKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            if (betaKeystore.exists()) signingConfig signingConfigs.beta
        }
        release {
            minifyEnabled false
            if (betaKeystore.exists()) signingConfig signingConfigs.beta
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            assets.srcDir "$buildDir/generated/mobileAssets"
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Keep the Android beta self-contained without duplicating multi-megabyte catalogs in git.
// The APK gets current snapshots from the same resources that ship with desktop MSBT.
tasks.register('syncMobileCatalogAssets', Copy) {
    into "$buildDir/generated/mobileAssets"
    from('../../external_app/v22_parts_codes_fixed/resources') {
        include 'MattsSDKBoostingTools_gzo_codes.json'
        include 'MattsSDKBoostingTools_lootlemon_codes.json'
        include 'custom_bl4_codes.json'
        include 'item_pools.json'
        include 'travelmaps_flat.json'
        include 'travelstations.json'
    }
    from('../../electron_poc') {
        include 'dev_spawner_catalog.json'
    }
}

preBuild.dependsOn syncMobileCatalogAssets
